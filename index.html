<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <main>

      
    <!--This is The main grid boxes-->
    <section class="grid">
        <div class='box nav' tabindex="0" id="0"></div>
        <div class='box nav' tabindex="0" id="1"></div>
        <div class='box nav' tabindex="0" id="2"></div>
        <div class='box nav' tabindex="0" id="3"></div>
        <div class='box nav' tabindex="0" id="4"></div>
        <div class='box nav' tabindex="0" id="5"></div>
        <div class='box nav' tabindex="0" id="6"></div>
        <div class='box nav' tabindex="0" id="7"></div>
        <div class='box nav' tabindex="0" id="8"></div>
        
    </section>
    <!--Button Below the Grid-->
    <section class="buttons">
        <div class='nav' tabindex="0" id="button"><h2>Reset!</h2></div>
        <div calss='nav' tabindex="0" id="turn"><h3><span class="text"></span></span></h3></div>
       
    </section>

    <table>
        <thead>
        <tr>
            <th colspan="2"><h3>SCOREBOARD</h3></th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td><h4>Player X</h4></td>
            <td><h4>Player O</h4></td>
        </tr>
        <tr>
            <td id="scoreX"><h4>0</h4></td>
            <td id="scoreO"><h4>0</h4></td>
        </tr>
        </tbody>
    </table>
        
    
    </main>

<script type="text/javascript" src="main.js"></script>
</body>
</html>
